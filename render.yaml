services:
  - type: web
    name: aif-chatbot
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd source/djangoserver && python manage.py migrate --noinput && python manage.py shell -c "from django.contrib.auth import get_user_model; U=get_user_model(); U.objects.filter(is_superuser=True).exists() or U.objects.create_superuser('admin','admin@example.com','admin123')" && gunicorn ragchatbot.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_ALLOWED_HOSTS
        value: "aif-t8v1.onrender.com"
