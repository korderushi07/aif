services:
  - type: web
    name: aif-chatbot
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_ALLOWED_HOSTS
        value: "aif-t8v1.onrender.com"
